<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Дом в Ереване — каталог</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --surface: #fcfcfb;
    --card: #ffffff;
    --text: #0b0b0b;
    --text-2: #52514e;
    --text-3: #8a887f;
    --line: #e8e7e2;
    --chip: #f0efec;
    --chip-on: #0b0b0b;
    --chip-on-text: #ffffff;
    --accent: #2a78d6;
    --good: #0ca30c;
    --warn: #b47500;
    --why: #0a7a3d;
    --why-bg: #eaf6ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --surface: #17181c;
      --card: #21232a;
      --text: #ffffff;
      --text-2: #b7bcc9;
      --text-3: #9298a6;
      --line: #3a3d47;
      --chip: #2c2f38;
      --chip-on: #f2f3f5;
      --chip-on-text: #14151a;
      --accent: #5aa2f0;
      --good: #3fce5a;
      --warn: #ffc23d;
      --why: #6bd898;
      --why-bg: #1d2f26;
    }
  }
  /* Take only surfaces + accent from Telegram; keep our own readable text/border
     tokens, because Telegram Desktop's hint color is often too dim to read. */
  html.tg {
    --surface: var(--tg-theme-bg-color, var(--surface));
    --card: var(--tg-theme-secondary-bg-color, var(--card));
    --text: var(--tg-theme-text-color, var(--text));
    --accent: var(--tg-theme-link-color, var(--accent));
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface);
    color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding-bottom: 40px;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 14px; }

  header { padding: 14px 0 6px; }
  h1 { font-size: 19px; margin: 0 0 2px; }
  .sub { color: var(--text-2); font-size: 13px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 4px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
  .stat .num { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  .stat .lbl { font-size: 12px; color: var(--text-2); margin-top: 1px; }

  .sources { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 2px; }
  .src { font-size: 12.5px; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 11px; }
  .src b { color: var(--text); font-weight: 600; }
  .src.warn { border-color: var(--warn); }
  .src .cnt { color: var(--text-2); }

  .filters {
    position: sticky; top: 0; z-index: 5;
    background: var(--surface);
    padding: 10px 0 8px;
    display: flex; gap: 6px; overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .filters::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: var(--chip);
    color: var(--text);
    border-radius: 999px;
    padding: 7px 13px;
    font-size: 13.5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.on { background: var(--chip-on); color: var(--chip-on-text); border-color: var(--chip-on); }
  select.chip { appearance: none; -webkit-appearance: none; }

  .cards { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 8px; }
  @media (min-width: 560px) { .cards { grid-template-columns: 1fr 1fr; } }
  a.card {
    display: block; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 13px 14px; overflow: hidden;
  }
  .ph {
    margin: -13px -14px 11px; aspect-ratio: 16 / 9;
    background: var(--chip); position: relative;
  }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* Placeholder for listings without a photo, so the grid stays consistent. */
  .ph.empty {
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--chip), var(--card));
  }
  .ph.empty .glyph { font-size: 40px; opacity: 0.5; }
  .fresh {
    font-size: 11px; font-weight: 600; color: var(--why);
    background: var(--why-bg); border-radius: 999px; padding: 2px 8px;
    vertical-align: 3px; margin-left: 6px; white-space: nowrap;
  }
  .ph .fresh { position: absolute; top: 8px; left: 8px; margin: 0; vertical-align: baseline; }
  .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
  .price { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
  .sqm { color: var(--text-2); font-size: 13px; white-space: nowrap; }
  .search {
    width: 100%; margin: 10px 0 2px; box-sizing: border-box;
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    border-radius: 12px; padding: 11px 14px; font-size: 15px; -webkit-appearance: none;
  }
  .search::placeholder { color: var(--text-3); }
  .drop {
    display: inline-block; font-size: 11px; font-weight: 600; color: #fff;
    background: #d0392f; border-radius: 999px; padding: 2px 8px; margin-left: 6px;
    vertical-align: 2px; white-space: nowrap;
  }
  .ph .drop { position: absolute; top: 8px; left: 8px; margin: 0; }
  .row2 { margin-top: 3px; font-size: 14.5px; }
  .desc { margin-top: 5px; font-size: 13px; color: var(--text-2); line-height: 1.4; }
  .row3 { margin-top: 5px; color: var(--text-2); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .contact { margin-top: 6px; font-size: 13.5px; color: var(--text); }
  .contact-phone { color: var(--accent); font-weight: 600; text-decoration: underline; }
  .fav {
    position: absolute; top: 8px; right: 8px; z-index: 2;
    width: 34px; height: 34px; border: none; border-radius: 999px;
    background: rgba(0,0,0,0.45); color: #fff; font-size: 17px; line-height: 34px;
    text-align: center; cursor: pointer; padding: 0; -webkit-tap-highlight-color: transparent;
  }
  .fav.on { color: #ff5a76; }
  .card { position: relative; }
  .why {
    margin-top: 8px; font-size: 13px; color: var(--why);
    background: var(--why-bg); border-radius: 8px; padding: 6px 9px;
  }
  .row4 { margin-top: 8px; display: flex; justify-content: space-between; gap: 10px; color: var(--text-3); font-size: 12px; }
  .badge { border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; }

  .more {
    margin: 16px auto 0; display: block;
    background: var(--chip); color: var(--text);
    border: 1px solid var(--line); border-radius: 12px;
    padding: 11px 22px; font-size: 14.5px; cursor: pointer;
  }
  .note { text-align: center; color: var(--text-2); font-size: 13.5px; padding: 26px 10px; }
  .skeleton { height: 108px; border-radius: 14px; border: 1px solid var(--line);
    background: linear-gradient(100deg, var(--card) 40%, var(--chip) 50%, var(--card) 60%);
    background-size: 200% 100%; animation: sh 1.2s infinite linear; }
  @keyframes sh { to { background-position: -200% 0; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Дом в Ереване</h1>
    <div class="sub" id="updated">Загружаю…</div>
    <div class="stats" id="stats" hidden>
      <div class="stat"><div class="num" id="statTotal">–</div><div class="lbl">объявлений</div></div>
      <div class="stat"><div class="num" id="statFresh">–</div><div class="lbl">свежих за сутки</div></div>
      <div class="stat"><div class="num" id="statSources">–</div><div class="lbl">источников работает</div></div>
    </div>
    <div class="sources" id="sources"></div>
  </header>

  <input type="search" id="search" class="search" placeholder="Поиск: район, улица, ключевое слово…" autocomplete="off">

  <div class="filters" id="filters">
    <button class="chip on" data-kind="">Все</button>
    <button class="chip" data-kind="apartment">Квартиры</button>
    <button class="chip" data-kind="house">Дома</button>
    <button class="chip" data-fav="1">❤ Избранное</button>
    <button class="chip" data-minarea="70">От 70 м²</button>
    <select class="chip" id="sortSel">
      <option value="fresh">Сначала свежие</option>
      <option value="value">Сначала выгодные</option>
      <option value="price_asc">Сначала дешевле</option>
      <option value="price_desc">Сначала дороже</option>
      <option value="area_desc">Больше площадь</option>
    </select>
    <select class="chip" id="districtSel"><option value="">Все районы</option></select>
    <select class="chip" id="priceSel">
      <option value="">Любая цена</option>
      <option value="80000">до $80k</option>
      <option value="100000">до $100k</option>
      <option value="120000">до $120k</option>
      <option value="150000">до $150k</option>
    </select>
  </div>

  <div class="cards" id="cards">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
  <button class="more" id="more" hidden>Показать ещё</button>
  <div class="note" id="note" hidden></div>
</div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    document.documentElement.classList.add("tg");
    try { tg.ready(); tg.expand(); } catch (e) {}
  }

  var all = [];
  var meta = null;
  var shown = 0;
  var PAGE = 20;
  var state = { kind: "", sort: "fresh", minArea: 0, location: "", maxPrice: 0, favOnly: false, query: "" };

  var $ = function (id) { return document.getElementById(id); };

  var FAV_KEY = "dom_favorites_v1";
  function loadFavs() {
    try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY) || "[]")); } catch (e) { return new Set(); }
  }
  var favs = loadFavs();
  function saveFavs() {
    try { localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); } catch (e) {}
  }
  function toggleFav(id) {
    if (favs.has(id)) favs.delete(id); else favs.add(id);
    saveFavs();
  }

  function money(v) { return "$" + Number(v || 0).toLocaleString("en-US"); }

  function rel(iso) {
    if (!iso) return "";
    var m = Math.round((Date.now() - Date.parse(iso)) / 60000);
    if (!isFinite(m)) return "";
    if (m < 1) return "только что";
    if (m < 60) return m + " мин назад";
    var h = Math.round(m / 60);
    if (h < 48) return h + " ч назад";
    return Math.round(h / 24) + " дн назад";
  }

  function conditionLabel(v) {
    return { ready: "с ремонтом", partial: "частичный ремонт", needs_work: "нужен ремонт" }[v] || "";
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function matches(item) {
    if (state.favOnly && !favs.has(item.id)) return false;
    if (state.kind && item.kindKey !== state.kind) return false;
    if (state.minArea && !(Number(item.areaSqm) >= state.minArea)) return false;
    if (state.location && item.location !== state.location) return false;
    if (state.maxPrice && Number(item.priceUsd) > state.maxPrice) return false;
    if (state.query) {
      var hay = ((item.location || "") + " " + (item.description || "") + " " + (item.kind || "") + " " + (item.sourceLabel || "")).toLowerCase();
      if (hay.indexOf(state.query) === -1) return false;
    }
    return true;
  }

  function sorted(items) {
    var arr = items.slice();
    if (state.sort === "value") {
      arr.sort(function (a, b) { return (b.valueScore || 0) - (a.valueScore || 0) || (a.priceUsd || 0) - (b.priceUsd || 0); });
    } else if (state.sort === "price_asc") {
      arr.sort(function (a, b) { return (a.priceUsd || 0) - (b.priceUsd || 0); });
    } else if (state.sort === "price_desc") {
      arr.sort(function (a, b) { return (b.priceUsd || 0) - (a.priceUsd || 0); });
    } else if (state.sort === "area_desc") {
      arr.sort(function (a, b) { return (b.areaSqm || 0) - (a.areaSqm || 0); });
    }
    return arr; // "fresh" keeps the server's newest-first order
  }

  function contactHtml(item) {
    if (!item.contactName && !item.contactPhone) return "";
    var parts = [];
    if (item.contactName) parts.push('<span>' + esc(item.contactName) + "</span>");
    if (item.contactPhone) {
      var tel = String(item.contactPhone).replace(/[^\d+]/g, "");
      parts.push('<span class="contact-phone" data-tel="' + esc(tel) + '">' + esc(item.contactPhone) + "</span>");
    }
    return '<div class="contact">📞 ' + parts.join(" · ") + "</div>";
  }

  function isFresh(item) {
    var t = Date.parse(item.publishedAt || 0);
    var u = Date.parse(item.updatedAt || 0);
    var day = 24 * 3600000;
    return (isFinite(t) && Date.now() - t < day) || (isFinite(u) && Date.now() - u < day);
  }

  function card(item) {
    var title = [
      item.rooms ? item.rooms + " комн." : null,
      item.areaSqm ? item.areaSqm + " м²" : null,
      item.floorLabel ? item.floorLabel + " эт." : null,
      item.landSqm ? "участок " + item.landSqm + " м²" : null,
    ].filter(Boolean).join(" · ");
    var metaBits = [
      item.location || "район не распознан",
      item.minutesToCenter != null ? item.minutesToCenter + " мин до центра" : null,
      conditionLabel(item.condition),
      item.elevator === true ? "лифт" : null,
    ].filter(Boolean);
    var when = item.updatedAt ? "обновлено " + rel(item.updatedAt) : item.publishedAt ? rel(item.publishedAt) : (item.discoveredAt ? "найдено " + rel(item.discoveredAt) : "");
    var src = esc(item.sourceLabel || "");
    if (item.alsoSources && item.alsoSources.length) src += " +" + item.alsoSources.length;

    var freshBadge = isFresh(item) ? '<span class="fresh">новое</span>' : "";
    var proxied = item.imageUrl ? "/img?u=" + encodeURIComponent(item.imageUrl) : "";
    var glyph = item.kindKey === "house" ? "🏡" : "🏢";
    var photo = proxied
      ? '<div class="ph" data-glyph="' + glyph + '"><img loading="lazy" src="' + esc(proxied) + '" alt="">' + freshBadge + "</div>"
      : '<div class="ph empty"><span class="glyph">' + glyph + "</span>" + freshBadge + "</div>";
    var isFav = favs.has(item.id);
    var favBtn = '<button class="fav' + (isFav ? " on" : "") + '" data-fav-id="' + esc(item.id) + '" aria-label="В избранное">' + (isFav ? "♥" : "♡") + "</button>";
    var dropBadge = item.priceDropPercent ? '<span class="drop">↓ ' + item.priceDropPercent + "%</span>" : "";
    return '<a class="card" href="' + esc(item.url) + '" target="_blank" rel="noopener">'
      + favBtn
      + photo
      + '<div class="row1"><span class="price">' + esc(item.kind) + " · " + money(item.priceUsd) + dropBadge + (photo ? "" : freshBadge) + "</span>"
      + (item.pricePerSqm ? '<span class="sqm">' + money(item.pricePerSqm) + "/м²</span>" : "")
      + "</div>"
      + (title ? '<div class="row2">' + esc(title) + "</div>" : "")
      + (item.description ? '<div class="desc">' + esc(item.description) + "</div>" : "")
      + contactHtml(item)
      + '<div class="row3">' + metaBits.map(function (b) { return "<span>" + esc(b) + "</span>"; }).join("") + "</div>"
      + (item.whyGood && item.whyGood.length >= 2 ? '<div class="why">' + esc("Почему интересно: " + item.whyGood.join("; ")) + "</div>" : "")
      + '<div class="row4"><span>' + esc(when) + '</span><span class="badge">' + src + "</span></div>"
      + "</a>";
  }

  function render(reset) {
    var items = sorted(all.filter(matches));
    if (reset) shown = 0;
    shown = Math.min(items.length, shown + PAGE);
    $("cards").innerHTML = items.slice(0, shown).map(card).join("") || "";
    $("cards").querySelectorAll(".ph img").forEach(function (img) {
      img.addEventListener("error", function () {
        var ph = img.parentNode;
        var glyph = ph.getAttribute("data-glyph") || "🏢";
        var badge = ph.querySelector(".fresh");
        ph.classList.add("empty");
        ph.innerHTML = '<span class="glyph">' + glyph + "</span>" + (badge ? badge.outerHTML : "");
      }, { once: true });
    });
    $("more").hidden = shown >= items.length;
    $("note").hidden = items.length > 0;
    if (items.length === 0) {
      $("note").textContent = state.favOnly
        ? "В избранном пока пусто. Нажми ♡ на карточке, чтобы сохранить вариант."
        : "Под эти фильтры пока ничего нет. Попробуй убрать часть фильтров.";
    }
  }

  function renderMeta() {
    if (!meta) return;
    $("updated").textContent = meta.updatedAt ? "Обновлено " + rel(meta.updatedAt) + " · проверяю каждые " + meta.scanIntervalMinutes + " мин" : "Первая проверка скоро";
    $("stats").hidden = false;
    $("statTotal").textContent = meta.total;
    $("statFresh").textContent = meta.freshLast24h;
    var ok = meta.sources.filter(function (s) { return s.ok; }).length;
    $("statSources").textContent = ok + "/" + meta.sources.length;
    $("sources").innerHTML = meta.sources.map(function (s) {
      var tail = s.ok ? ' <span class="cnt">· ' + s.listings + "</span>" : ' <span class="cnt">· идёт проверка</span>';
      return '<span class="src' + (s.ok ? "" : " warn") + '">' + (s.ok ? "✅" : "⏳") + " <b>" + esc(s.label) + "</b>" + tail + "</span>";
    }).join("");
    var sel = $("districtSel");
    meta.locations.forEach(function (loc) {
      var o = document.createElement("option");
      o.value = loc; o.textContent = loc;
      sel.appendChild(o);
    });
  }

  function load() {
    fetch("/api/listings?limit=300").then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    }).then(function (data) {
      meta = data;
      all = data.listings || [];
      renderMeta();
      render(true);
    }).catch(function (e) {
      $("cards").innerHTML = "";
      $("note").hidden = false;
      $("note").innerHTML = "Не получилось загрузить: " + esc(e.message) + '<br><br><button class="more" onclick="location.reload()">Обновить</button>';
    });
  }

  var searchTimer = null;
  $("search").addEventListener("input", function () {
    var value = this.value.trim().toLowerCase();
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function () { state.query = value; render(true); }, 200);
  });

  $("filters").addEventListener("click", function (event) {
    var btn = event.target.closest("button.chip");
    if (!btn) return;
    if (btn.dataset.kind !== undefined) {
      state.kind = btn.dataset.kind;
      document.querySelectorAll("[data-kind]").forEach(function (b) { b.classList.toggle("on", b === btn); });
    }
    if (btn.dataset.fav) {
      state.favOnly = btn.classList.toggle("on");
    }
    if (btn.dataset.minarea) {
      var onA = btn.classList.toggle("on");
      state.minArea = onA ? Number(btn.dataset.minarea) : 0;
    }
    render(true);
  });
  $("sortSel").addEventListener("change", function () { state.sort = this.value; this.classList.toggle("on", this.value !== "fresh"); render(true); });
  $("districtSel").addEventListener("change", function () { state.location = this.value; this.classList.toggle("on", !!this.value); render(true); });
  $("priceSel").addEventListener("change", function () { state.maxPrice = Number(this.value) || 0; this.classList.toggle("on", !!this.value); render(true); });
  $("more").addEventListener("click", function () { render(false); });

  // Tapping the heart toggles a favourite; tapping the phone calls — both
  // without following the card link to the source listing.
  $("cards").addEventListener("click", function (event) {
    var phone = event.target.closest(".contact-phone");
    if (phone) {
      event.preventDefault();
      event.stopPropagation();
      var tel = phone.getAttribute("data-tel");
      if (tel) window.location.href = "tel:" + tel;
      return;
    }
    var fav = event.target.closest(".fav");
    if (!fav) return;
    event.preventDefault();
    event.stopPropagation();
    var id = fav.getAttribute("data-fav-id");
    toggleFav(id);
    var nowOn = favs.has(id);
    fav.classList.toggle("on", nowOn);
    fav.textContent = nowOn ? "♥" : "♡";
    if (state.favOnly && !nowOn) render(true);
  });

  load();
})();
</script>
</body>
</html>
