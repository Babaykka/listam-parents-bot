services:
  - type: web
    name: listam-parents-bot
    runtime: docker
    plan: starter
    region: frankfurt
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: listam-parents-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: AI_FILTERS_ENABLED
        value: "true"
      - key: MAX_PRICE_USD
        value: "120000"
      - key: MIN_QUALITY_SCORE
        value: "0"
      - key: LISTAM_CATEGORY_IDS
        value: "60,62"
      - key: LISTAM_PAGES_PER_CATEGORY
        value: "1"
      - key: LISTAM_PAGE_WAIT_SECONDS
        value: "60"
      - key: LISTAM_CHALLENGE_MAX_SECONDS
        value: "45"
      - key: NAVIGATION_TIMEOUT_MS
        value: "75000"
      - key: SCAN_ISSUE_ALERTS
        value: "true"
      - key: SCAN_ISSUE_ALERT_AFTER
        value: "3"
      - key: SCAN_ISSUE_ALERT_COOLDOWN_MINUTES
        value: "360"
      - key: POLL_INTERVAL_MINUTES
        value: "20"
      - key: TELEGRAM_BATCH_SIZE
        value: "6"
      - key: SEND_INITIAL
        value: "false"
      - key: SCAN_ON_START
        value: "false"
      - key: TELEGRAM_LONG_POLL_FALLBACK
        value: "true"
