services:
  - type: web
    name: listam-parents-bot
    runtime: docker
    plan: starter
    region: frankfurt
    autoDeploy: true
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    disk:
      name: listam-parents-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: AI_FILTERS_ENABLED
        value: "true"
      - key: MAX_PRICE_USD
        value: "120000"
      - key: MIN_QUALITY_SCORE
        value: "0"
      - key: LISTAM_CATEGORY_IDS
        value: "60,62"
      - key: LISTAM_PAGES_PER_CATEGORY
        value: "1"
      - key: LISTAM_PAGE_WAIT_SECONDS
        value: "60"
      - key: LISTAM_CHALLENGE_MAX_SECONDS
        value: "45"
      - key: NAVIGATION_TIMEOUT_MS
        value: "75000"
      - key: SCAN_ISSUE_ALERTS
        value: "true"
      - key: SCAN_ISSUE_ALERT_AFTER
        value: "3"
      - key: SCAN_ISSUE_ALERT_COOLDOWN_MINUTES
        value: "360"
      - key: MYREALTY_FALLBACK_ENABLED
        value: "true"
      - key: MYREALTY_PAGES_PER_CATEGORY
        value: "5"
      - key: ESTATE_FALLBACK_ENABLED
        value: "true"
      - key: BANALI_FALLBACK_ENABLED
        value: "true"
      - key: BANALI_PAGES_PER_CATEGORY
        value: "5"
      - key: BANALI_CONCURRENCY
        value: "4"
      - key: AMD_PER_USD
        value: "390"
      - key: NOTIFY_PUBLISHED_WITHIN_DAYS
        value: "30"
      - key: NOTIFY_UPDATED_WITHIN_DAYS
        value: "14"
      - key: USER_SCAN_ENABLED
        value: "true"
      - key: USER_SCAN_COOLDOWN_MINUTES
        value: "10"
      - key: POLL_INTERVAL_MINUTES
        value: "5"
      - key: BLOCKED_POLL_INTERVAL_MINUTES
        value: "15"
      - key: BLOCKED_POLL_MAX_INTERVAL_MINUTES
        value: "60"
      - key: TELEGRAM_BATCH_SIZE
        value: "6"
      - key: TELEGRAM_SEND_DELAY_MS
        value: "80"
      - key: TELEGRAM_RETRY_MAX_SECONDS
        value: "3"
      - key: MAX_LISTINGS_CACHE
        value: "1000"
      - key: SEND_INITIAL
        value: "false"
      - key: SCAN_ON_START
        value: "true"
      - key: TELEGRAM_LONG_POLL_FALLBACK
        value: "true"
